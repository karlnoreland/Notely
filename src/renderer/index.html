<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vault: https: http:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <title>Notely</title>
  </head>
  <body>
    <div id="app" hidden>
      <aside id="sidebar">
        <div class="sidebar-header">
          <span id="vault-name" class="vault-name"></span>
          <div class="sidebar-actions">
            <button id="btn-new-note" class="icon-btn" title="New note (Ctrl+N)" aria-label="New note">
              <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M12 11v6M9 14h6" /></svg>
            </button>
            <button id="btn-new-folder" class="icon-btn" title="New folder" aria-label="New folder">
              <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M12 10v6M9 13h6" /></svg>
            </button>
          </div>
        </div>
        <nav id="file-tree" class="file-tree"></nav>
        <div class="sidebar-footer">
          <button id="btn-switch-vault" class="text-btn">Open another vault…</button>
        </div>
        <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize · double-click to reset"></div>
      </aside>
      <main id="main">
        <header id="topbar">
          <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle sidebar (Ctrl+\)" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
          </button>
          <div id="note-title" class="note-title"></div>
          <div id="save-state" class="save-state"></div>
          <button id="btn-theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
        </header>
        <div id="panes" class="panes"></div>
        <footer id="statusbar">
          <button id="mode-toggle" class="status-btn" title="Toggle live preview (Ctrl+Shift+E)"></button>
          <span id="word-count"></span>
        </footer>
      </main>
    </div>

    <div id="welcome" class="welcome" hidden>
      <div class="welcome-card">
        <h1>Notely</h1>
        <p>Your notes are plain Markdown files in a folder on your computer.</p>
        <div class="welcome-actions">
          <button id="btn-open-vault" class="primary-btn">Open folder as vault</button>
          <button id="btn-open-file" class="secondary-btn">Open a single file</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
